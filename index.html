<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台股查詢">
<title>台股個股查詢</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #09070f; --bg2: #0c0918; --bg3: #100d1c;
    --border: #201535; --text: #f0e8ff; --muted: #7060a0;
    --accent: #e8b84b; --up: #ff4055; --down: #44cc88;
    --red: #ff4055; --green: #44cc88; --yellow: #e8b84b;
    --blue: #9b7fff; --purple: #bb88ff;
    --card-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .theme-intl { --up: #44cc88; --down: #ff4055; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 80px; }
  .top-bar { position: sticky; top: 0; z-index: 100; background: linear-gradient(90deg,#0c0918,#140f25); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .search-row { display: flex; gap: 8px; align-items: center; }
  .app-title { font-size: 13px; font-weight: 900; color: var(--accent); letter-spacing: 1px; white-space: nowrap; }
  .search-box { flex: 1; display: flex; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .search-box input { flex: 1; background: transparent; border: none; outline: none; color: var(--text); font-size: 16px; padding: 10px 12px; font-family: 'JetBrains Mono', monospace; letter-spacing: 2px; }
  .search-box input::placeholder { color: var(--muted); letter-spacing: 1px; font-size: 13px; }
  .search-btn { background: #e8b84b; border: none; cursor: pointer; padding: 0 18px; font-size: 18px; transition: background .2s; }
  .search-btn:active { opacity: .8; }
  .theme-btn { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--muted); font-size: 11px; cursor: pointer; }
  .theme-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .gold-divider { height: 1px; background: linear-gradient(90deg,#e8b84b,#a07020,transparent); margin: 10px 0 0; }
  .info-label { font-size: 10px; color: #8070a8; margin-bottom: 3px; }
  .stock-header { padding: 16px; background: linear-gradient(135deg,#0c0918,#140f25); border-bottom: 1px solid var(--border); display: none; }
  .stock-header.show { display: block; animation: fadeIn .3s ease; }
  .stock-name-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .stock-name { font-size: 20px; font-weight: 900; color: #f0e8ff; }
  .stock-code { font-size: 13px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }
  .stock-industry { font-size: 11px; color: #c8a060; letter-spacing: .5px; margin-bottom: 10px; }
  .price-row { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
  .price-main { font-size: 42px; font-weight: 900; font-family: 'JetBrains Mono', monospace; line-height: 1; }
  .price-change { font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .price-meta { display: flex; gap: 16px; margin-top: 10px; flex-wrap: wrap; }
  .price-meta-item { font-size: 12px; color: #7060a0; }
  .price-meta-item span { color: #e8e0f8; font-weight: 600; }
  .up { color: var(--red); } .down { color: var(--green); } .flat { color: var(--muted); }
  .tabs { display: flex; overflow-x: auto; gap: 0; background: #0a0816; border-bottom: 1px solid var(--border); scrollbar-width: none; position: sticky; top: 95px; z-index: 90; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex-shrink: 0; padding: 12px 18px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: #3a2558; transition: all .2s; white-space: nowrap; }
  .tab.active { color: #e8b84b; border-bottom-color: #e8b84b; }
  .content { padding: 16px; display: none; }
  .content.active { display: block; animation: fadeIn .25s ease; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-left: 2px solid #e8b84b; border-radius: 14px; padding: 16px; margin-bottom: 12px; box-shadow: var(--card-shadow); }
  .card-title { font-size: 12px; font-weight: 700; color: #8070a8; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }
  .card-title::before { content: ''; display: block; width: 3px; height: 12px; background: #e8b84b; border-radius: 2px; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-item { background: var(--bg3); border-radius: 10px; padding: 12px; }
  .info-value { font-size: 18px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .chips-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .chips-table th { text-align: right; padding: 8px 6px; color: var(--muted); font-weight: 600; font-size: 11px; border-bottom: 1px solid var(--border); }
  .chips-table th:first-child { text-align: left; }
  .chips-table td { text-align: right; padding: 10px 6px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
  .chips-table td:first-child { text-align: left; color: var(--text); font-weight: 600; font-family: 'Noto Sans TC', sans-serif; }
  .chips-table tr:last-child td { border-bottom: none; }
  .num-up { color: var(--red); } .num-down { color: var(--green); } .num-flat { color: var(--muted); }
  .chart-wrap { position: relative; height: 200px; margin-top: 10px; }
  .holder-bar-wrap { margin: 10px 0; }
  .holder-bar-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
  .holder-bar { height: 8px; border-radius: 4px; background: var(--bg3); overflow: hidden; }
  .holder-bar-fill { height: 100%; border-radius: 4px; transition: width .8s ease; }
  .dividend-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dividend-table th { padding: 8px 6px; color: var(--muted); font-size: 11px; font-weight: 600; border-bottom: 1px solid var(--border); text-align: center; }
  .dividend-table td { padding: 10px 6px; text-align: center; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
  .dividend-table tr:last-child td { border-bottom: none; }
  .news-item { padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
  .news-item:last-child { border-bottom: none; }
  .news-title { font-size: 14px; font-weight: 500; line-height: 1.5; margin-bottom: 4px; }
  .news-meta { font-size: 11px; color: var(--muted); }
  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  .welcome { text-align: center; padding: 60px 20px; }
  .welcome-icon { font-size: 64px; margin-bottom: 16px; }
  .welcome-title { font-size: 22px; font-weight: 900; color: #e8b84b; margin-bottom: 8px; }
  .welcome-sub { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .quick-stocks { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 24px; }
  .quick-stock { padding: 6px 14px; border-radius: 20px; background: var(--bg3); border: 1px solid var(--border); font-size: 13px; cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all .2s; }
  .quick-stock:active { background: var(--accent); color: var(--bg); }
  .error-msg { text-align: center; padding: 30px; color: var(--red); font-size: 14px; }
  .yield-big { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .yield-item { text-align: center; background: var(--bg3); border-radius: 10px; padding: 12px 8px; }
  .yield-label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .yield-value { font-size: 18px; font-weight: 900; color: #e8b84b; font-family: 'JetBrains Mono', monospace; }
  .rev-summary { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .rev-badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
  .rev-badge.up { background: rgba(255,68,102,.15); color: var(--red); }
  .rev-badge.down { background: rgba(0,212,170,.15); color: var(--green); }
  .rev-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .rev-table th { padding: 8px 6px; color: var(--muted); font-size: 11px; border-bottom: 1px solid var(--border); text-align: right; }
  .rev-table th:first-child { text-align: left; }
  .rev-table td { padding: 9px 6px; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; text-align: right; }
  .rev-table td:first-child { text-align: left; }
  .rev-table tr:last-child td { border-bottom: none; }
  /* 券商 */
  .period-bar { display: flex; gap: 6px; flex-wrap: wrap; }
  .period-btn { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg3); color: var(--muted); font-size: 12px; cursor: pointer; }
  .period-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .broker-header { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--border); letter-spacing: .5px; }
  .broker-header span { font-weight: 400; font-size: 10px; }
  .buy-header { color: var(--red); }
  .sell-header { color: var(--green); }
  .broker-row { padding: 5px 6px; border-bottom: 1px solid #150e22; position: relative; }
  .broker-bar-bg { position: absolute; inset: 0; overflow: hidden; }
  .broker-bar-fill { height: 100%; opacity: .13; border-radius: 2px; }
  .broker-bar-fill.buy { background: var(--red); }
  .broker-bar-fill.sell { background: var(--green); }
  .broker-row-inner { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
  .broker-name { font-size: 11px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 70px; }
  .broker-val { font-size: 11px; font-family: 'JetBrains Mono', monospace; font-weight: 700; flex-shrink: 0; }
  /* 自選 */
  .wl-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 10px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .wl-del { color: var(--muted); font-size: 10px; cursor: pointer; padding: 0 2px; }
  .wl-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .wl-card-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; cursor: pointer; gap: 8px; }
  .wl-card-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
  .wl-card-code { font-family: 'JetBrains Mono', monospace; font-weight: 900; font-size: 15px; }
  .wl-card-name { font-size: 12px; color: var(--muted); }
  .wl-card-price { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 16px; }
  .wl-card-chg { font-size: 11px; font-family: 'JetBrains Mono', monospace; }
  .wl-card-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .wl-arrow { font-size: 12px; color: var(--muted); }
  .wl-del-btn { color: var(--muted); font-size: 16px; padding: 4px 6px; }
  .wl-card-body { border-top: 1px solid var(--border); }
  .wl-mini-tabs { display: flex; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); background: var(--bg3); }
  .wl-mini-tabs::-webkit-scrollbar { display: none; }
  .wl-mini-tab { flex-shrink: 0; padding: 9px 14px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .wl-mini-tab.active { color: #e8b84b; border-bottom-color: #e8b84b; }
  .wl-pane { padding: 12px 14px; }
  /* 特徵標籤 */
  .feature-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 4px; min-height: 14px; }
  .ftag { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 7px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .3px; cursor: pointer; user-select: none; transition: opacity .15s, transform .15s; border: 1px solid transparent; white-space: nowrap; }
  .ftag:active { opacity: .75; transform: scale(.96); }
  .ftag-icon { font-size: 11px; }
  .ftag-trust   { background: rgba(155,127,255,.18); color: #bb99ff; border-color: rgba(155,127,255,.35); }
  .ftag-foreign { background: rgba(74,180,255,.15); color: #7fd4ff; border-color: rgba(74,180,255,.30); }
  .ftag-divhi   { background: rgba(232,184,75,.18); color: #e8b84b; border-color: rgba(232,184,75,.38); }
  .ftag-divcont { background: rgba(232,184,75,.12); color: #c8983b; border-color: rgba(232,184,75,.25); }
  .ftag-revhi   { background: rgba(255,120,50,.15); color: #ffaa70; border-color: rgba(255,120,50,.30); }
  .ftag-weekly  { background: rgba(80,220,140,.14); color: #55dd99; border-color: rgba(80,220,140,.30); }
  .ftag-hot     { background: rgba(255,60,160,.15); color: #ff80cc; border-color: rgba(255,60,160,.28); }
  .ftag-modal-overlay { position: fixed; inset: 0; z-index: 9000; background: rgba(0,0,0,.65); display: flex; align-items: flex-end; justify-content: center; animation: fadeIn .18s ease; }
  .ftag-modal { background: #120e20; border: 1px solid #2a1d45; border-radius: 20px 20px 0 0; padding: 20px 20px 32px; width: 100%; max-width: 480px; max-height: 70vh; overflow-y: auto; }
  .ftag-modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .ftag-modal-icon { font-size: 24px; }
  .ftag-modal-name { font-size: 18px; font-weight: 900; color: var(--accent); }
  .ftag-modal-close { margin-left: auto; background: #1e1535; border: none; border-radius: 50%; width: 28px; height: 28px; color: var(--muted); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .ftag-modal-desc { font-size: 14px; color: #c0b0e0; line-height: 1.7; }
  .ftag-modal-detail { margin-top: 14px; padding-top: 14px; border-top: 1px solid #201535; }
  .ftag-modal-detail-title { font-size: 11px; color: var(--muted); letter-spacing: 1px; margin-bottom: 8px; }
  .ftag-modal-val { font-size: 20px; font-weight: 900; font-family: 'JetBrains Mono', monospace; color: var(--accent); }
  .ftag-modal-val-label { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .disclaimer { font-size: 10px; color: var(--muted); text-align: center; padding: 16px; line-height: 1.6; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="top-bar">
  <div class="search-row">
    <div class="app-title">📈 台股</div>
    <div class="search-box">
      <input type="text" id="stockInput" placeholder="輸入股票代號，如 2330" maxlength="6" inputmode="numeric">

<div class="stock-header" id="stockHeader">
  <div class="stock-name-row">
    <div class="stock-name" id="headerName">–</div>
    <div class="stock-code" id="headerCode">–</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <div class="stock-industry" id="headerIndustry" style="margin-bottom:0">–</div>
    <button onclick="addToWatchlist()" style="margin-left:auto;background:#1a2236;border:1px solid #1e2d45;border-radius:8px;color:#e8edf5;font-size:11px;padding:4px 10px;cursor:pointer;flex-shrink:0;">⭐ 加自選</button>

</div>

<div class="content" id="tab-chips" style="display:none"><div id="chipsContent"></div></div>

<script>
// ============================================================
// 工具函式
// ============================================================
let currentStock = null;
let charts = {};

function todayStr(){ return new Date().toISOString().split('T')[0]; }
function dateNDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; }
function dateNYearsAgo(n){ const d=new Date(); d.setFullYear(d.getFullYear()-n); return d.toISOString().split('T')[0]; }

// 代理抓取（Yahoo Finance 需要 CORS proxy）
async function proxyfetch(url){
  const proxies=[
    u=>`https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
    u=>`https://corsproxy.io/?${encodeURIComponent(u)}`,
  ];
  let lastErr;
  for(const mk of proxies){
    try{
      const res=await fetch(mk(url),{signal:AbortSignal.timeout(10000)});
      if(!res.ok) throw new Error('http '+res.status);
      const json=await res.json();
      const text=typeof json==='string'?json:(json.contents??JSON.stringify(json));
      return JSON.parse(text);
    }catch(e){ lastErr=e; }
  }
  throw lastErr;
}

// API：股價 — 優先 Yahoo Finance，備用 TWSE
// ============================================================
async function fetchPrice(code){
  try{
    const symbol=code+'.TW';
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1d`;
    const data=await proxyfetch(url);
    const meta=data.chart.result[0].meta;
    return{
      price:meta.regularMarketPrice,
      open:meta.regularMarketOpen,
      high:meta.regularMarketDayHigh,
      low:meta.regularMarketDayLow,
      prevClose:meta.chartPreviousClose,
      volume:meta.regularMarketVolume,
      change:meta.regularMarketPrice-meta.chartPreviousClose,
      changePct:(meta.regularMarketPrice-meta.chartPreviousClose)/meta.chartPreviousClose*100,
    };
  }catch(e){ return fetchPriceTWSE(code); }
}

async function fetchPriceTWSE(code){
  // TWSE 盤中即時（需透過 proxy 解 CORS）
  const url=`https://mis.twse.com.tw/stock/api/getStockInfo.jsp?ex_ch=tse_${code}.tw&json=1&delay=0`;
  const data=await proxyfetch(url);
  const s=data.msgArray?.[0];
  if(!s||!s.z) throw new Error('無法取得股價，請確認代號');
  const price=parseFloat(s.z);
  const prev=parseFloat(s.y);
  return{
    price,open:parseFloat(s.o||s.y),high:parseFloat(s.h||s.y),
    low:parseFloat(s.l||s.y),prevClose:prev,
    volume:parseInt((s.v||'0').replace(/,/g,'')),
    change:price-prev,changePct:(price-prev)/prev*100,
  };
}

// API：法人籌碼 — TWSE 三大法人
// ============================================================
async function fetchChips(code){
  // TWSE 提供三大法人每日買賣超，最近60天
  const rows=[];
  const today=new Date();
  // 嘗試抓最近60個日曆天內的交易日資料（TWSE 按月查詢）
  for(let mOffset=0;mOffset<3;mOffset++){
    try{
      const d=new Date(today);
      d.setMonth(d.getMonth()-mOffset);
      const ym=d.getFullYear()+''+String(d.getMonth()+1).padStart(2,'0');
      const url=`https://www.twse.com.tw/rwd/zh/fund/TWT38U?stockNo=${code}&date=${ym}01&response=json`;
      const res=await fetch(url,{signal:AbortSignal.timeout(8000)});
      const json=await res.json();
      if(json.stat==='OK'&&json.data?.length){
        json.data.forEach(r=>{
          // r: [日期, 外資買, 外資賣, 外資買賣超, 投信買, 投信賣, 投信買賣超, 自營商買, 自營商賣, 自營商買賣超, 三大法人買賣超]
          const date=r[0].replace(/(\d+)\/(\d+)\/(\d+)/,(_,y,m,d)=>`${parseInt(y)+1911}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`);
          const parse=s=>parseInt((s||'0').replace(/,/g,''));
          rows.push({
            date,
            foreign_buy:parse(r[1]),foreign_sell:parse(r[2]),foreign_net:parse(r[3]),
            trust_buy:parse(r[4]),trust_sell:parse(r[5]),trust_net:parse(r[6]),
            dealer_net:parse(r[9]),total_net:parse(r[10]),
          });
        });
      }
    }catch{}
  }
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}

// ============================================================
// API：月營收 — TWSE 月營收公告
// ============================================================
async function fetchRevenue(code){
  const rows=[];
  const today=new Date();
  for(let mOffset=0;mOffset<24;mOffset++){
    try{
      const d=new Date(today);
      d.setMonth(d.getMonth()-mOffset-1); // 營收公告比當月晚一個月
      const year=d.getFullYear()-1911;
      const month=String(d.getMonth()+1).padStart(2,'0');
      const url=`https://www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_d?date=${d.getFullYear()}${month}01&response=json`;
      // 改用個股月營收查詢
      const url2=`https://www.twse.com.tw/rwd/zh/revenue/TMOSL?date=${d.getFullYear()}${month}01&stockNo=${code}&type=ALL&response=json`;
      const res=await fetch(url2,{signal:AbortSignal.timeout(8000)});
      const json=await res.json();
      if(json.stat==='OK'&&json.data?.length){
        const r=json.data[0];
        // r: [年月, 股票代號, 公司名, 當月營收, 上月營收, 去年同月, 上月比較, 去年同月比較, 當月累計, 去年累計, 前年累計比較]
        const parse=s=>parseInt((s||'0').replace(/,/g,''));
        const revenue=parse(r[3]);
        const prev_rev=parse(r[4]);
        const yoy_rev=parse(r[5]);
        const mom=(prev_rev>0?(revenue-prev_rev)/prev_rev*100:null);
        const yoy=(yoy_rev>0?(revenue-yoy_rev)/yoy_rev*100:null);
        rows.push({
          date:`${parseInt(year)+1911}-${month}`,
          revenue,
          revenue_month_on_month:mom,
          revenue_year_on_year:yoy,
        });
      }
    }catch{}
  }
  return rows;
}

async function fetchHolder(code){
  try{
    // 集保股權分散表（最新一期）
    const url=`https://www.tdcc.com.tw/portal/zh/smWeb/qryStock?CUKY=${code}`;
    // 改用 TWSE API
    const url2=`https://www.twse.com.tw/rwd/zh/BWIBBU/BWIBBU_d?response=json&date=${todayStr().replace(/-/g,'')}&stockNo=${code}`;
    // 集保直接沒 CORS，改抓 TWSE 大股東統計（需 proxy）
    const proxyUrl=`https://api.allorigins.win/get?url=${encodeURIComponent('https://www.tdcc.com.tw/portal/zh/smWeb/qryStock?CUKY='+code)}`;
    const res=await fetch(proxyUrl,{signal:AbortSignal.timeout(10000)});
    const json=await res.json();
    // 解析 HTML 表格
    const parser=new DOMParser();
    const doc=parser.parseFromString(json.contents,'text/html');
    const rows=doc.querySelectorAll('table tr');
    const result=[];
    let latestDate='';
    rows.forEach((tr,i)=>{
      if(i===0) return;
      const tds=[...tr.querySelectorAll('td')].map(td=>td.textContent.trim());
      if(tds.length>=4){
        if(!latestDate&&tds[0].match(/\d{4}-\d{2}-\d{2}/)) latestDate=tds[0];
        const level=tds[1];
        const people=parseInt((tds[2]||'0').replace(/,/g,''));
        const shares=parseInt((tds[3]||'0').replace(/,/g,''));
        const pct=parseFloat(tds[4]||'0');
        result.push({date:latestDate||tds[0],HoldingSharesLevel:level,people,shares,percent:pct});
      }
    });
    return result;
  }catch{ return []; }
}

async function fetchNews(keyword){

// ============================================================
async function fetchOHLC(code){
  const symbol=code+'.TW';
  const url=`https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=6mo`;
  const data=await proxyfetch(url);
  const r=data.chart.result[0];
  const ts=r.timestamps;
  const q=r.indicators.quote[0];
  const out=[];
  for(let i=0;i<ts.length;i++){
    if(q.close[i]==null) continue;
    out.push({date:new Date(ts[i]*1000).toISOString().slice(0,10),open:q.open[i],high:q.high[i],low:q.low[i],close:q.close[i],vol:q.volume[i]||0});
  }
  return out;
}

let brokerDays=1;
async function loadBroker(code,days){
  brokerDays=days;
  document.getElementById('brokerContent').innerHTML=`<div class="loading"><div class="spinner"></div>載入中...</div>`;
  try{
    // TWSE 分點進出 API（需按日查詢）
    const rows=[];
    const dates=[];
    // 先抓最近幾天有交易的日期
    const d=new Date();
    for(let i=0;i<days*3&&dates.length<days;i++){
      d.setDate(d.getDate()-1);
      const yyyymmdd=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
      try{
        const url=`https://www.twse.com.tw/rwd/zh/fund/T86?date=${yyyymmdd}&stockNo=${code}&response=json`;
        const res=await fetch(url,{signal:AbortSignal.timeout(6000)});
        const json=await res.json();
        if(json.stat==='OK'&&json.data?.length){
          dates.push(yyyymmdd);
          json.data.forEach(r=>{
            // r: [券商代號, 券商名稱, 買進股數, 賣出股數, 買賣超]
            const brokerKey=r[0];
            const name=r[1]||r[0];
            const buy=parseInt((r[2]||'0').replace(/,/g,''));
            const sell=parseInt((r[3]||'0').replace(/,/g,''));
            const net=parseInt((r[4]||'0').replace(/[,+]/g,''));
            if(!rows.find(x=>x.key===brokerKey)) rows.push({key:brokerKey,name,buy:0,sell:0,net:0});
            const idx=rows.findIndex(x=>x.key===brokerKey);
            rows[idx].buy+=buy; rows[idx].sell+=sell; rows[idx].net+=net;
          });
        }
      }catch{}
    }
    if(!rows.length) throw new Error('no data');
    const buyTop=[...rows].sort((a,b)=>b.net-a.net).slice(0,15);
    const sellTop=[...rows].sort((a,b)=>a.net-b.net).slice(0,15);
    const periodBtns=[1,3,5,10,20].map(d=>`<button class="period-btn ${d===days?'active':''}" onclick="loadBroker('${code}',${d})">${d}天</button>`).join('');
    const totalAbs=rows.reduce((s,x)=>s+Math.abs(x.net),0)||1;
    function row(b,isBuy){
      const val=isBuy?b.net:Math.abs(b.net);
      const pct=Math.min(val/totalAbs*300,100);
      return`<div class="broker-row"><div class="broker-bar-bg"><div class="broker-bar-fill ${isBuy?'buy':'sell'}" style="width:${pct}%"></div></div><div class="broker-row-inner"><span class="broker-name">${b.name}</span><span class="broker-val" style="color:${isBuy?'var(--up)':'var(--down)'}">${isBuy?'+':'−'}${val.toLocaleString()}</span></div></div>`;
    }
    document.getElementById('brokerContent').innerHTML=`
      <div style="padding:14px 14px 0">
        <div class="period-bar">${periodBtns}</div>
        <div style="font-size:11px;color:var(--muted);margin:6px 0 12px">統計近 ${dates.length} 個交易日・資料取 TWSE 分點進出</div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0;padding:0 14px 14px">
        <div><div class="broker-header buy-header">買超 Top15<br><span>股數</span></div>${buyTop.map(b=>row(b,true)).join('')}</div>
        <div><div class="broker-header sell-header">賣超 Top15<br><span>股數</span></div>${sellTop.map(b=>row(b,false)).join('')}</div>
      </div>`;
  }catch(e){
    document.getElementById('brokerContent').innerHTML=`<div class="error-msg">⚠️ 主力券商資料載入失敗<br><small>${e.message}</small></div>`;
  }
}

async function computeAndShowTags(code,priceData,basicData){
  const tagsEl=document.getElementById('featureTags');
  if(!tagsEl) return;
  tagsEl.style.display='flex';
  tagsEl.innerHTML='<span style="font-size:11px;color:#4a3060">分析中…</span>';

let techLoaded={};
function calcMA(closes,n){ return closes.map((_,i)=>{ if(i<n-1)return null; return+(closes.slice(i-n+1,i+1).reduce((a,b)=>a+b,0)/n).toFixed(2); }); }
function calcKD(highs,lows,closes,n=9){ const K=[],D=[];let prevK=50,prevD=50;for(let i=0;i<closes.length;i++){if(i<n-1){K.push(null);D.push(null);continue;}const low9=Math.min(...lows.slice(i-n+1,i+1)),high9=Math.max(...highs.slice(i-n+1,i+1));const rsv=high9===low9?50:(closes[i]-low9)/(high9-low9)*100;const k=prevK*2/3+rsv/3,d=prevD*2/3+k/3;K.push(+k.toFixed(2));D.push(+d.toFixed(2));prevK=k;prevD=d;}return{K,D}; }
function calcMACD(closes){ function ema(arr,n){const k=2/(n+1);let prev=null;const res=[];for(const v of arr){if(prev===null){res.push(v);prev=v;}else{const e=v*k+prev*(1-k);res.push(+e.toFixed(4));prev=e;}}return res;}const ema12=ema(closes,12),ema26=ema(closes,26);const dif=ema12.map((v,i)=>+(v-ema26[i]).toFixed(4));const dea=ema(dif,9);const hist=dif.map((v,i)=>+((v-dea[i])*2).toFixed(4));return{dif,dea,hist}; }

async function loadTechnical(code){
  const el=document.getElementById('technicalContent'); if(!el) return;
  if(techLoaded[code]){renderTechnical(code,techLoaded[code]);return;}
  el.innerHTML=`<div class="loading"><div class="spinner"></div>載入K線資料中...</div>`;
  try{ const ohlc=await fetchOHLC(code); if(!ohlc.length)throw new Error('no data'); techLoaded[code]=ohlc; renderTechnical(code,ohlc); }
  catch(e){ el.innerHTML=`<div class="error-msg">⚠️ 技術分析資料載入失敗<br><small>${e.message}</small></div>`; }
}

function renderTechnical(code,ohlc){
  const el=document.getElementById('technicalContent'); if(!el) return;
  const labels=ohlc.map(d=>d.date.slice(5));
  const closes=ohlc.map(d=>d.close),highs=ohlc.map(d=>d.high),lows=ohlc.map(d=>d.low),vols=ohlc.map(d=>d.vol);
  const ma5=calcMA(closes,5),ma10=calcMA(closes,10),ma20=calcMA(closes,20),ma60=calcMA(closes,60);
  const{K,D}=calcKD(highs,lows,closes);
  const{dif,dea,hist}=calcMACD(closes);
  const lastK=K[K.length-1],lastD=D[D.length-1],lastDif=dif[dif.length-1],lastDea=dea[dea.length-1],lastHist=hist[hist.length-1];
  const kdSignal=lastK>lastD?'<span style="color:var(--up)">多頭(K>D)</span>':'<span style="color:var(--down)">空頭(K<D)</span>';
  const kdZone=lastK>=80?'<span style="color:var(--up)">超買⚠️</span>':lastK<=20?'<span style="color:var(--down)">超賣⚠️</span>':'<span style="color:var(--muted)">中性</span>';
  const macdSignal=lastDif>lastDea?'<span style="color:var(--up)">多頭(DIF>DEA)</span>':'<span style="color:var(--down)">空頭(DIF<DEA)</span>';
  el.innerHTML=`
    <div class="card"><div class="card-title">均線 MA</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span style="font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(255,200,50,.15);color:#ffc832;font-family:'JetBrains Mono',monospace">MA5 ${ma5[ma5.length-1]??'–'}</span><span style="font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(74,180,255,.15);color:#4ab4ff;font-family:'JetBrains Mono',monospace">MA10 ${ma10[ma10.length-1]??'–'}</span><span style="font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(255,100,180,.15);color:#ff80cc;font-family:'JetBrains Mono',monospace">MA20 ${ma20[ma20.length-1]??'–'}</span><span style="font-size:11px;padding:3px 9px;border-radius:12px;background:rgba(155,127,255,.15);color:#bb99ff;font-family:'JetBrains Mono',monospace">MA60 ${ma60[ma60.length-1]??'–'}</span></div><div class="chart-wrap" style="height:220px"><canvas id="maChart"></canvas></div></div>
    <div class="card"><div class="card-title">KD 隨機指標（9日）</div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;align-items:center"><span>K:<b style="font-family:'JetBrains Mono';color:#e8b84b">${lastK??'–'}</b></span><span>D:<b style="font-family:'JetBrains Mono';color:#bb99ff">${lastD??'–'}</b></span><span>${kdSignal}</span><span>${kdZone}</span></div><div class="chart-wrap" style="height:160px"><canvas id="kdChart"></canvas></div></div>
    <div class="card"><div class="card-title">MACD（12/26/9）</div><div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;align-items:center"><span>DIF:<b style="font-family:'JetBrains Mono';color:#e8b84b">${lastDif??'–'}</b></span><span>DEA:<b style="font-family:'JetBrains Mono';color:#bb99ff">${lastDea??'–'}</b></span><span>${macdSignal}</span></div><div class="chart-wrap" style="height:180px"><canvas id="macdChart"></canvas></div></div>
    <div class="card"><div class="card-title">成交量</div><div class="chart-wrap" style="height:130px"><canvas id="volChart"></canvas></div></div>`;
  ['techMA','techKD','techMACD','techVol'].forEach(k=>{if(charts[k]){charts[k].destroy();delete charts[k];}});
  const gc='#1a1230',tc='#5a4080';
  const bs={x:{ticks:{color:tc,font:{size:9},maxTicksLimit:8},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10}},grid:{color:gc}}};
  const bp={legend:{labels:{color:tc,font:{size:10},boxWidth:10}}};
  charts.techMA=new Chart(document.getElementById('maChart'),{type:'line',data:{labels,datasets:[{label:'收盤',data:closes,borderColor:'rgba(240,232,255,.9)',borderWidth:1.5,pointRadius:0,tension:.3},{label:'MA5',data:ma5,borderColor:'#ffc832',borderWidth:1.2,pointRadius:0,tension:.3,spanGaps:true},{label:'MA10',data:ma10,borderColor:'#4ab4ff',borderWidth:1.2,pointRadius:0,tension:.3,spanGaps:true},{label:'MA20',data:ma20,borderColor:'#ff80cc',borderWidth:1.2,pointRadius:0,tension:.3,spanGaps:true},{label:'MA60',data:ma60,borderColor:'#bb99ff',borderWidth:1.2,pointRadius:0,tension:.3,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},plugins:bp,scales:bs}});
  charts.techKD=new Chart(document.getElementById('kdChart'),{type:'line',data:{labels,datasets:[{label:'K',data:K,borderColor:'#e8b84b',borderWidth:1.5,pointRadius:0,tension:.3,spanGaps:true},{label:'D',data:D,borderColor:'#bb99ff',borderWidth:1.5,pointRadius:0,tension:.3,spanGaps:true}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},plugins:bp,scales:{x:bs.x,y:{min:0,max:100,ticks:{color:tc,font:{size:10},callback:v=>[0,20,50,80,100].includes(v)?v:''},grid:{color:gc}}}}});
  const hc=hist.map(v=>v>=0?'rgba(255,64,85,.8)':'rgba(68,204,136,.8)');
  charts.techMACD=new Chart(document.getElementById('macdChart'),{type:'bar',data:{labels,datasets:[{label:'MACD柱',data:hist,backgroundColor:hc,borderRadius:1,order:2},{label:'DIF',data:dif,type:'line',borderColor:'#e8b84b',borderWidth:1.5,pointRadius:0,tension:.3,order:1},{label:'DEA',data:dea,type:'line',borderColor:'#bb99ff',borderWidth:1.5,pointRadius:0,tension:.3,order:1}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},plugins:bp,scales:bs}});
  const vc=ohlc.map(d=>d.close>=d.open?'rgba(255,64,85,.7)':'rgba(68,204,136,.7)');
  charts.techVol=new Chart(document.getElementById('volChart'),{type:'bar',data:{labels,datasets:[{label:'成交量',data:vols,backgroundColor:vc,borderRadius:1}]},options:{responsive:true,maintainAspectRatio:false,animation:{duration:300},plugins:{legend:{display:false}},scales:{x:bs.x,y:{ticks:{color:tc,font:{size:10},callback:v=>v>=1e8?(v/1e8).toFixed(0)+'億':v>=1e4?(v/1e4).toFixed(0)+'萬':v},grid:{color:gc}}}}});
}

function formatDate(dateStr){ if(!dateStr)return''; try{ const d=new Date(dateStr); return`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`; }catch{ return dateStr; } }

renderWatchlistBar();
(function(){ const t=localStorage.getItem('colorTheme')||'tw'; setTheme(t); })();
